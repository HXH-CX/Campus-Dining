server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端限制 10MB，这里留一点余量；不设的话 nginx 默认 1M，
    # 手机直拍的照片会先被 nginx 用 413 挡掉，而后端那句"超过 10MB"的提示根本到不了前端
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端走的是同源请求（/api/v1/...），所以容器里不需要 CORS，只要把路径转给后端
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 登录限流按来源 IP 计数，要让它看到真实地址
        proxy_read_timeout 30s;
    }

    # 上传的图片由后端直接静态托管，同样转发
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 带 hash 的构建产物可以长期缓存；index.html 不能缓存，
    # 否则发新版后用户手上的旧 index 会一直去要已经删掉的 chunk
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由：/posts/123 这类地址在磁盘上没有对应文件，统一回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
